# Day 17: the off-site backup puller may only fetch backups with rsync, read-only.
Match User vaultlab-offsite
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/bin/rrsync -ro /var/backups/vaultlab/
# End the Match block (harmless here, and safe if these lines are ever pasted into the main config)
Match all
