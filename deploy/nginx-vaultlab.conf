# VaultLab (Day 13): HTTPS in front of the API and the built React app
# Installed as /etc/nginx/sites-available/vaultlab

# Port 80: plain HTTP. Never serve anything here: send everyone to HTTPS.
server {
    listen 80;
    server_name vaultlab.home;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vaultlab.home;

    # The certificate (public, sent to every client) and its private key (never leaves this machine)
    ssl_certificate     /etc/nginx/vaultlab/vaultlab.home.crt;
    ssl_certificate_key /etc/nginx/vaultlab/vaultlab.home.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;   # say "nginx", not "nginx/1.24.0 (Ubuntu)"

    # HSTS: "for the next 5 minutes, only ever use HTTPS for this name". Short on purpose while testing.
    add_header Strict-Transport-Security "max-age=300" always;

    # Day 21: a strict Content-Security-Policy. The built app loads only its own bundled JS and CSS
    # from this origin, so 'self' is all it needs: no inline scripts, no inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Day 21: supporting headers
    add_header X-Content-Type-Options "nosniff" always;                        # don't guess content types
    add_header X-Frame-Options "DENY" always;                                  # don't allow this page in a frame
    add_header Referrer-Policy "no-referrer" always;                           # don't leak the URL to other sites
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # WARNING (Day 21): nginx's add_header is "replace per scope", not additive. If you add ANY add_header
    # inside a location block below, that location silently loses every header set here. Check the HTML page
    # with `curl -sI https://vaultlab.home/`, not only an /api URL.

    # The API: passed on to Node, which now listens only on 127.0.0.1:3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the built React app
    location / {
        root /var/www/vaultlab;
        try_files $uri /index.html;
    }
}